<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joplin Web App</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #22262b;
            --bg-notelist: #2a2e33;
            --bg-editor: #1e1e1e;
            --text-main: #d4d4d4;
            --text-muted: #8e9297;
            --accent-blue: #0e639c;
            --hover-bg: #353b42;
            --border-color: #3a3f45;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: var(--bg-editor); color: var(--text-main); overflow: hidden; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        #sidebar { width: 220px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        #notes-list { width: 320px; background-color: var(--bg-notelist); display: flex; flex-direction: column; flex-shrink: 0; border-left: 1px solid var(--border-color); }
        #editor { flex-grow: 1; padding: 0; overflow-y: auto; background-color: var(--bg-editor); font-size: 15px; line-height: 1.6; min-width: 300px; display: flex; flex-direction: column; }
        
        .resizer { width: 4px; background-color: var(--border-color); cursor: col-resize; flex-shrink: 0; z-index: 10; transition: background-color 0.2s; }
        .resizer:hover, .resizer.active { background-color: var(--accent-blue); }

        .header { padding: 12px 15px; font-weight: 600; background-color: transparent; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        .list-container { overflow-y: auto; flex-grow: 1; }
        
        .folder-item { cursor: pointer; font-size: 13px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .folder-title { padding: 6px 15px; display: flex; align-items: center; }
        .folder-title:hover { background-color: var(--hover-bg); }
        .folder-title.active { background-color: var(--accent-blue); color: white; }
        .children-container { border-left: 1px solid #444; margin-left: 20px; }
        .toggle-arrow { display: inline-block; width: 12px; margin-right: 5px; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
        .toggle-arrow.open { transform: rotate(90deg); }
        
        .sidebar-actions { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 5px; background-color: var(--bg-sidebar); }
        .action-btn { flex: 1; padding: 8px; background: var(--bg-notelist); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .action-btn:hover { background: var(--hover-bg); border-color: var(--text-main); }

        .note-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 14px; line-height: 1.4; }
        .note-item:hover { background-color: var(--hover-bg); }
        .note-item.active { background-color: var(--accent-blue); color: white; }
        
        .search-bar { margin: 10px; padding: 6px 10px; background-color: #1a1c1f; border: 1px solid var(--border-color); border-radius: 4px; color: white; font-size: 13px; }
        .sort-dropdown { margin: 0 10px 10px 10px; padding: 5px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }
        .sort-dropdown:hover { border-color: var(--text-main); }
        
        .tag-filter-container { position: relative; margin: 0 10px 10px 10px; }
        .tag-filter-btn { width: 100%; padding: 6px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; font-size: 12px; text-align: left; cursor: pointer; }
        .tag-filter-btn:hover { border-color: var(--text-main); }
        .tag-dropdown { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-sidebar); border: 1px solid var(--border-color); max-height: 250px; overflow-y: auto; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; }
        .tag-dropdown label { display: flex; align-items: center; padding: 4px; font-size: 12px; color: var(--text-main); cursor: pointer; }
        .tag-dropdown label:hover { background-color: var(--hover-bg); }
        .tag-actions { border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 5px; display: flex; gap: 10px; }
        .tag-actions span { color: var(--accent-blue); cursor: pointer; font-size: 11px; font-weight: bold; }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-editor); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        input.login-input { padding: 12px; margin: 10px; font-size: 16px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-notelist); color: white; width: 320px; }
        button.login-btn { padding: 12px 24px; background-color: var(--accent-blue); color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button.login-btn:hover { background-color: #1177bb; }

        #editor-content { padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        #editor h1 { font-size: 1.8em; margin-bottom: 0.5em; color: white; }
        #editor h2, #editor h3 { color: #569cd6; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 30px; }
        #editor a { color: #569cd6; text-decoration: none; }
        #editor a:hover { text-decoration: underline; }
        #editor code { background-color: var(--bg-notelist); padding: 2px 5px; border-radius: 3px; font-family: Consolas, monospace; color: #ce9178; font-size: 0.9em; }
        #editor pre { background-color: var(--bg-notelist); padding: 15px; border-radius: 5px; overflow-x: auto; border: 1px solid var(--border-color); }
        #editor blockquote { border-left: 4px solid var(--accent-blue); margin-left: 0; padding-left: 15px; color: var(--text-muted); }
        #editor input[type="checkbox"] { margin-right: 8px; transform: scale(1.1); cursor: pointer; }
        #editor table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 14px; }
        #editor th, #editor td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        #editor th { background-color: var(--bg-notelist); font-weight: bold; color: white; }
        #editor img { max-width: 100%; border-radius: 5px; margin: 15px 0; border: 1px solid #444; cursor: zoom-in; transition: 0.2s; }
        #editor img:hover { border-color: var(--text-main); }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; cursor: zoom-out; backdrop-filter: blur(5px); }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .mobile-back { display: none; padding: 12px 15px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-main); font-weight: bold; align-items: center; gap: 8px; }
        .mobile-back:hover { background: var(--hover-bg); }
        
        .editor-tools { display: flex; gap: 10px; margin-top: 10px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .resizer { display: none; }
            #sidebar, #notes-list, #editor { width: 100% !important; height: 100vh; flex-shrink: 0; border: none; }
            #editor-content { padding: 20px; }
            
            body.view-sidebar #notes-list, body.view-sidebar #editor { display: none !important; }
            body.view-notes #sidebar, body.view-notes #editor { display: none !important; }
            body.view-editor #sidebar, body.view-editor #notes-list { display: none !important; }
            
            .mobile-back { display: flex; }
        }

        /* REGOLE DI STAMPA */
        @media print {
            #sidebar, #notes-list, .resizer, .sidebar-actions, .mobile-back, .editor-tools { display: none !important; }
            body { background: white !important; color: black !important; overflow: visible !important; height: auto !important; }
            #editor { width: 100% !important; padding: 0 !important; background: white !important; color: black !important; }
            #editor-content { padding: 0 !important; max-width: 100% !important; }
            #editor h1, #editor h2, #editor h3, #editor a { color: black !important; }
            mark { background-color: transparent !important; color: black !important; font-weight: bold; }
        }
    </style>
</head>
<body class="view-sidebar">

   <!-- OVERLAY LOGIN -->
    <div id="login-overlay">
        <form onsubmit="event.preventDefault(); performLogin();" style="display: flex; flex-direction: column; align-items: center;">
            <h2 style="margin-bottom: 5px;">Joplin Web Access</h2>
            <p style="color: #888; margin-bottom: 20px;">Inserisci le tue credenziali</p>
            <input type="email" id="emailInput" class="login-input" placeholder="Email" required>
            <input type="password" id="passwordInput" class="login-input" placeholder="Password" required>
            <button type="submit" class="login-btn">Accedi alle Note</button>
        </form>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <div id="sidebar">
        <div class="header">📓 Taccuini</div>
        <div id="folders-container" class="list-container"></div>
        <div class="sidebar-actions">
            <button class="action-btn" onclick="refreshData()">🔄 Aggiorna</button>
            <button class="action-btn" onclick="logout()">🚪 Esci</button>
        </div>
    </div>
    
    <div class="resizer" id="resizer-1"></div>

    <div id="notes-list">
        <div class="mobile-back" onclick="history.back()">⬅️ Torna ai Taccuini</div>
        
        <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); padding-top: 10px;">
            <input type="text" id="searchInput" class="search-bar" style="margin-top: 0;" placeholder="Cerca titolo, testo o tag..." onkeyup="updateNoteList()">
            
            <select id="searchScope" class="sort-dropdown" onchange="updateNoteList()">
                <option value="global">🌍 Cerca ovunque (Tutti i taccuini)</option>
                <option value="current">📂 Cerca solo nel Taccuino corrente</option>
            </select>

            <select id="sortSelect" class="sort-dropdown" onchange="updateNoteList()">
                <option value="date-desc">📅 Data (Più recenti prima)</option>
                <option value="date-asc">📅 Data (Più vecchie prima)</option>
                <option value="title-asc">🔤 Nome (A - Z)</option>
                <option value="title-desc">🔤 Nome (Z - A)</option>
            </select>

            <div class="tag-filter-container">
                <button id="tagFilterBtn" class="tag-filter-btn" onclick="toggleTagDropdown()">🏷️ Filtra / Cerca per Tag...</button>
                <div id="tagDropdown" class="tag-dropdown"></div>
            </div>
        </div>
        <div id="notes-container" class="list-container">
            <div style="padding:15px; color:#888; font-size: 13px;">Seleziona un taccuino...</div>
        </div>
    </div>

    <div class="resizer" id="resizer-2"></div>

    <div id="editor">
        <div class="mobile-back" onclick="history.back()">⬅️ Torna alla Lista Note</div>
        <div id="editor-content">
            <div style="color: #888; text-align: center; margin-top: 20vh; font-size: 18px;">Seleziona una nota per la lettura</div>
        </div>
    </div>

    <script>
        let allFolders = [];
        let allNotes = [];
        let currentFolderId = null;
        let currentNoteId = null;
        let currentSortMethod = 'date-desc';
        
        let loggedUserId = localStorage.getItem('joplin_user_id');

        window.onload = function() {
            initResizers();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
            if (loggedUserId) {
                fetchDataFromServer(loggedUserId);
            }
        };

        async function performLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if(!email || !password) return alert('Inserisci email e password');

            document.getElementById('login-overlay').innerHTML = '<h2>Autenticazione...</h2>';
            try {
                const loginRes = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const loginData = await loginRes.json();

                if (!loginRes.ok) {
                    alert('Errore: ' + loginData.error);
                    location.reload();
                    return;
                }

                localStorage.setItem('joplin_user_id', loginData.userId);
                loggedUserId = loginData.userId;
                fetchDataFromServer(loggedUserId);

            } catch (error) {
                alert('Errore di connessione al server');
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('joplin_user_id');
            location.reload();
        }

        function refreshData() {
            if (loggedUserId) fetchDataFromServer(loggedUserId);
        }

        async function fetchDataFromServer(userId) {
            document.getElementById('login-overlay').innerHTML = '<h2>Sincronizzazione in corso...</h2>';
            document.getElementById('login-overlay').style.display = 'flex';
            
            try {
                const timestamp = new Date().getTime();
                const dataRes = await fetch(`/api/data/${userId}?t=${timestamp}`, { cache: 'no-store' });
                const data = await dataRes.json();
                
                allFolders = data.folders;
                allNotes = data.notes;
                
                document.getElementById('login-overlay').style.display = 'none';
                renderTagDropdown();
                renderFolderTree();
                
                if (currentFolderId) {
                    updateNoteList(); 
                }
                
                if (currentNoteId) {
                    const updatedNote = allNotes.find(n => n.id === currentNoteId);
                    if (updatedNote) {
                        renderContent(updatedNote);
                        document.querySelectorAll('.note-item').forEach(el => {
                            if (el.innerText.includes(updatedNote.title)) {
                                el.classList.add('active');
                            }
                        });
                    }
                }
            } catch (error) {
                alert('Sessione scaduta o errore server. Esegui nuovo login.');
                logout();
            }
        }

        if (!history.state) {
            history.replaceState({ view: 'sidebar', lightbox: false }, '');
        }

        function switchView(viewName, isPopState = false) {
            document.body.className = 'view-' + viewName;
            if (!isPopState) {
                history.pushState({ view: viewName, lightbox: false }, '');
            }
        }

        window.addEventListener('popstate', function(event) {
            const lightboxEl = document.getElementById('lightbox');
            if (event.state) {
                document.body.className = 'view-' + (event.state.view || 'sidebar');
                if (event.state.lightbox) {
                    lightboxEl.style.display = 'flex';
                } else {
                    lightboxEl.style.display = 'none';
                    document.getElementById('lightbox-img').src = '';
                }
            } else {
                document.body.className = 'view-sidebar';
                lightboxEl.style.display = 'none';
            }
        });

        function sortNotesArray(notesArray) {
            return notesArray.sort((a, b) => {
                if (currentSortMethod === 'date-desc') return b.updated_time - a.updated_time;
                if (currentSortMethod === 'date-asc') return a.updated_time - b.updated_time;
                if (currentSortMethod === 'title-asc') return a.title.localeCompare(b.title);
                if (currentSortMethod === 'title-desc') return b.title.localeCompare(a.title);
            });
        }

        function getFolderAndChildrenIds(folderId) {
            let ids = [folderId];
            const children = allFolders.filter(f => f.parent_id === folderId);
            children.forEach(child => { ids = ids.concat(getFolderAndChildrenIds(child.id)); });
            return ids;
        }

        function updateNoteList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const scope = document.getElementById('searchScope').value;
            const tagFilter = getSelectedTags();
            const container = document.getElementById('notes-container');
            const isTagFiltered = document.querySelectorAll('.tag-checkbox:not(:checked)').length > 0;
            const isSearching = query !== '' || isTagFiltered;

            let targetNotes = [];
            if (isSearching) {
                if (scope === 'current') {
                    if (currentFolderId) {
                        const validFolderIds = getFolderAndChildrenIds(currentFolderId);
                        targetNotes = allNotes.filter(n => validFolderIds.includes(n.parent_id));
                    } else {
                        container.innerHTML = '<div style="padding:15px; color:#888;">Seleziona prima un taccuino.</div>'; return;
                    }
                } else { targetNotes = [...allNotes]; }
            } else {
                if (currentFolderId) { targetNotes = allNotes.filter(n => n.parent_id === currentFolderId); }
                else { container.innerHTML = '<div style="padding:15px; color:#888;">Seleziona un taccuino...</div>'; return; }
            }

            const filteredNotes = targetNotes.filter(note => {
                let matchesQuery = true;
                if (query) matchesQuery = note.title.toLowerCase().includes(query) || note.body.toLowerCase().includes(query) || (note.tags && note.tags.join(' ').toLowerCase().includes(query));
                let matchesTags = isNoteVisibleByTags(note, tagFilter);
                return matchesQuery && matchesTags;
            });

            currentSortMethod = document.getElementById('sortSelect').value;
            sortNotesArray(filteredNotes);

            container.innerHTML = '';
            if (filteredNotes.length === 0) {
                container.innerHTML = '<div style="padding:15px; color:#888;">Nessun risultato trovato</div>'; return;
            }

            filteredNotes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-item';
                let tagsHtml = note.tags && note.tags.length > 0 ? `<div style="font-size: 11px; color: var(--accent-blue); margin-top: 5px;">🏷️ ${note.tags.join(', ')}</div>` : '';
                div.innerHTML = `${isSearching ? '🔍 ' : ''}<strong>${note.title}</strong>${tagsHtml}`; 
                
                div.onclick = () => {
                    currentNoteId = note.id;
                    document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderContent(note);
                    switchView('editor'); 
                };
                container.appendChild(div);
            });
        }

        function renderFolderTree() {
            const container = document.getElementById('folders-container');
            container.innerHTML = '';
            const folderMap = {};
            allFolders.forEach(f => folderMap[f.id] = { ...f, children: [] });
            const rootFolders = [];
            allFolders.forEach(f => {
                if (f.parent_id && folderMap[f.parent_id]) folderMap[f.parent_id].children.push(folderMap[f.id]);
                else rootFolders.push(folderMap[f.id]);
            });
            rootFolders.sort((a, b) => a.title.localeCompare(b.title));
            Object.values(folderMap).forEach(f => f.children.sort((a, b) => a.title.localeCompare(b.title)));

            function createFolderHTML(folder) {
                const wrapper = document.createElement('div');
                wrapper.className = 'folder-item';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'folder-title';
                const hasChildren = folder.children.length > 0;
                const arrow = hasChildren ? `<span class="toggle-arrow">▶</span>` : `<span class="toggle-arrow" style="visibility:hidden;">▶</span>`;
                const icon = folder.icon ? `<span style="margin-right: 8px;">${folder.icon}</span>` : `<span style="margin-right: 8px;">📁</span>`;
                titleDiv.innerHTML = `${arrow}${icon}${folder.title}`;
                
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'children-container';
                childrenContainer.style.display = 'none';

                titleDiv.onclick = (e) => {
                    document.querySelectorAll('.folder-title').forEach(el => el.classList.remove('active'));
                    titleDiv.classList.add('active');
                    if(hasChildren) {
                        const isClosed = childrenContainer.style.display === 'none';
                        childrenContainer.style.display = isClosed ? 'block' : 'none';
                        titleDiv.querySelector('.toggle-arrow').classList.toggle('open', isClosed);
                    }
                    document.getElementById('searchInput').value = '';
                    document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = true);
                    currentFolderId = folder.id;
                    updateNoteList();
                    switchView('notes');
                };
                wrapper.appendChild(titleDiv);
                if (hasChildren) {
                    folder.children.forEach(child => childrenContainer.appendChild(createFolderHTML(child)));
                    wrapper.appendChild(childrenContainer);
                }
                return wrapper;
            }
            rootFolders.forEach(root => container.appendChild(createFolderHTML(root)));
        }

        const renderer = new marked.Renderer();
        renderer.link = function({ href, title, text }) {
            const isResource = href.includes('/api/resource/');
            const icon = isResource ? '📎 ' : '';
            return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: #569cd6; text-decoration: none;">${icon}${text}</a>`;
        };
        renderer.checkbox = function({ checked }) {
            return `<input type="checkbox" disabled ${checked ? 'checked' : ''}>`;
        };
        marked.use({ renderer });

        function highlightSearchTerm(html, query) {
            if (!query) return html;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(?![^<]*>)(?:${escaped})`, 'gi');
            return html.replace(regex, match => `<mark style="background-color: #f1c40f; color: #000; padding: 0 2px; border-radius: 2px;">${match}</mark>`);
        }

        function printNote() {
            window.print();
        }

        function exportMarkdown() {
            if (!currentNoteId) return;
            const note = allNotes.find(n => n.id === currentNoteId);
            if (!note) return;
            const blob = new Blob([note.body], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${note.title.replace(/[/\\?%*:|"<>]/g, '_')}.md`;
            link.click();
        }

        function renderContent(note) {
            const editorContent = document.getElementById('editor-content');
            let dateStr = 'Data sconosciuta';
            if (note.updated_time > 0) {
                dateStr = new Date(note.updated_time).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            let cleanBody = note.body.replace(/:\/([a-zA-Z0-9]{32})(?:\.[a-zA-Z0-9]+)?/g, '/api/resource/$1');
            let htmlContent = marked.parse(cleanBody);
            
            const query = document.getElementById('searchInput').value.trim();
            htmlContent = highlightSearchTerm(htmlContent, query);

            editorContent.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h1>${note.title}</h1>
                    <div style="color: var(--text-muted); font-size: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                        <span>Ultima modifica: ${dateStr}</span>
                        <div class="editor-tools">
                            <button class="action-btn" onclick="printNote()">🖨️ Stampa</button>
                            <button class="action-btn" onclick="exportMarkdown()">📥 Esporta .md</button>
                        </div>
                    </div>
                </div>
                <div>${htmlContent}</div>
            `;

            const images = editorContent.querySelectorAll('img');
            images.forEach(img => {
                img.onclick = function() {
                    document.getElementById('lightbox-img').src = this.src;
                    document.getElementById('lightbox').style.display = 'flex';
                    const currentView = (history.state && history.state.view) ? history.state.view : 'editor';
                    history.pushState({ view: currentView, lightbox: true }, '');
                };
            });
        }

        function closeLightbox() {
            if (history.state && history.state.lightbox) {
                history.back();
            } else {
                document.getElementById('lightbox').style.display = 'none';
                document.getElementById('lightbox-img').src = '';
            }
        }

        function toggleTagDropdown() {
            const dropdown = document.getElementById('tagDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function renderTagDropdown() {
            let uniqueTags = new Set();
            allNotes.forEach(note => { if (note.tags) note.tags.forEach(t => uniqueTags.add(t)); });
            const sortedTags = Array.from(uniqueTags).sort();
            const container = document.getElementById('tagDropdown');
            let html = `
                <div class="tag-actions">
                    <span onclick="selectAllTags(true)">Seleziona Tutti</span>
                    <span onclick="selectAllTags(false)">Nessuno</span>
                </div>
                <label><input type="checkbox" class="tag-checkbox" value="__NO_TAGS__" checked onchange="updateNoteList()"> <i>Nessun Tag</i></label>
            `;
            sortedTags.forEach(tag => {
                html += `<label><input type="checkbox" class="tag-checkbox" value="${tag}" checked onchange="updateNoteList()"> ${tag}</label>`;
            });
            container.innerHTML = html;
        }

        function selectAllTags(select) {
            document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = select);
            updateNoteList();
        }

        function getSelectedTags() {
            const selected = [];
            let noTagSelected = false;
            document.querySelectorAll('.tag-checkbox').forEach(cb => {
                if (cb.checked) {
                    if (cb.value === '__NO_TAGS__') noTagSelected = true;
                    else selected.push(cb.value);
                }
            });
            return { selected, noTagSelected };
        }

        function isNoteVisibleByTags(note, tagFilter) {
            const hasTags = note.tags && note.tags.length > 0;
            if (!hasTags) return tagFilter.noTagSelected;
            return note.tags.some(t => tagFilter.selected.includes(t));
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('tagDropdown');
            const btn = document.getElementById('tagFilterBtn');
            if (dropdown && btn && !dropdown.contains(e.target) && e.target !== btn) {
                dropdown.style.display = 'none';
            }
        });

        function initResizers() {
            const resizer1 = document.getElementById('resizer-1');
            const sidebar = document.getElementById('sidebar');
            const resizer2 = document.getElementById('resizer-2');
            const notesList = document.getElementById('notes-list');
            let currentResizer = null;

            resizer1.addEventListener('mousedown', function(e) {
                currentResizer = { el: resizer1, panel: sidebar, startX: e.clientX, startWidth: sidebar.getBoundingClientRect().width };
                document.body.style.cursor = 'col-resize';
                resizer1.classList.add('active');
            });
            resizer2.addEventListener('mousedown', function(e) {
                currentResizer = { el: resizer2, panel: notesList, startX: e.clientX, startWidth: notesList.getBoundingClientRect().width };
                document.body.style.cursor = 'col-resize';
                resizer2.classList.add('active');
            });
            document.addEventListener('mousemove', function(e) {
                if (!currentResizer) return;
                const newWidth = currentResizer.startWidth + (e.clientX - currentResizer.startX);
                if (newWidth > 150 && newWidth < 600) currentResizer.panel.style.width = newWidth + 'px';
            });
            document.addEventListener('mouseup', function() {
                if (currentResizer) {
                    currentResizer.el.classList.remove('active');
                    currentResizer = null;
                    document.body.style.cursor = 'default';
                }
            });
        }
    </script>
</body>
</html>
