<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joplin Web Portal</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #22262b;
            --bg-notelist: #2a2e33;
            --bg-editor: #1e1e1e;
            --text-main: #d4d4d4;
            --text-muted: #8e9297;
            --accent-blue: #0e639c;
            --hover-bg: #353b42;
            --border-color: #3a3f45;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: var(--bg-editor); color: var(--text-main); overflow: hidden; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        #sidebar { width: 240px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        #notes-list { width: 320px; background-color: var(--bg-notelist); display: flex; flex-direction: column; flex-shrink: 0; border-left: 1px solid var(--border-color); }
        #editor { flex-grow: 1; padding: 0; overflow-y: auto; background-color: var(--bg-editor); font-size: 15px; line-height: 1.6; min-width: 300px; display: flex; flex-direction: column; }
        
        .resizer { width: 4px; background-color: var(--border-color); cursor: col-resize; flex-shrink: 0; z-index: 10; }
        .resizer:hover, .resizer.active { background-color: var(--accent-blue); }

        .header { padding: 12px 15px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .list-container { overflow-y: auto; flex-grow: 1; }
        
        .folder-item { cursor: pointer; font-size: 13px; color: #ccc; }
        .folder-title { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d3238; }
        .folder-title:hover { background-color: var(--hover-bg); }
        .folder-title.active { background-color: var(--accent-blue); color: white; }
        
        .sidebar-actions { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 5px; background-color: var(--bg-sidebar); }
        .action-btn { flex: 1; padding: 8px; background: var(--bg-notelist); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 12px; }
        .action-btn:hover { background: var(--hover-bg); }

        .note-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .note-item:hover { background-color: var(--hover-bg); }
        .note-item.active { background-color: var(--accent-blue); color: white; }
        
        .search-bar { margin: 10px; padding: 6px 10px; background-color: #1a1c1f; border: 1px solid var(--border-color); border-radius: 4px; color: white; font-size: 13px; }

        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        input.login-input { padding: 12px; margin: 10px 0; font-size: 15px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-notelist); color: white; width: 100%; box-sizing: border-box; }
        button.login-btn { padding: 10px 20px; background-color: var(--accent-blue); color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; }

        #editor-content { padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        #editor h1 { font-size: 1.8em; margin-bottom: 0.5em; color: white; }
        #editor h2, #editor h3 { color: #569cd6; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 30px; }
        #editor a { color: #569cd6; text-decoration: none; }
    </style>
</head>
<body>

    <!-- MODALE LOGIN PRIVATO -->
    <div id="login-modal">
        <div style="background: var(--bg-sidebar); padding: 30px; border-radius: 8px; width: 320px; border: 1px solid var(--border-color);">
            <h3 style="margin-top:0; color:white;">Accedi alle Note Private</h3>
            <p style="color: #888; font-size: 13px;">Inserisci le tue credenziali per sbloccare i taccuini riservati.</p>
            <input type="email" id="emailInput" class="login-input" placeholder="Email">
            <input type="password" id="passwordInput" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="performLogin()">Accedi</button>
            <button class="action-btn" style="width:100%; margin-top:10px;" onclick="closeLoginModal()">Annulla</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="header">
            <span>🌐 Vetrina Web</span>
            <span id="auth-status" style="font-size:10px; color:#569cd6;"></span>
        </div>
        <div id="folders-container" class="list-container"></div>
        <div class="sidebar-actions">
            <button class="action-btn" onclick="fetchPublishedData()">🔄 Aggiorna</button>
            <button id="auth-btn" class="action-btn" onclick="handleAuthClick()">🔑 Accedi</button>
        </div>
    </div>
    
    <div class="resizer" id="resizer-1"></div>

    <div id="notes-list">
        <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); padding-top: 10px;">
            <input type="text" id="searchInput" class="search-bar" placeholder="Cerca nelle note..." onkeyup="updateNoteList()">
        </div>
        <div id="notes-container" class="list-container">
            <div style="padding:15px; color:#888; font-size: 13px;">Seleziona un taccuino...</div>
        </div>
    </div>

    <div class="resizer" id="resizer-2"></div>

    <div id="editor">
        <div id="editor-content">
            <div style="color: #888; text-align: center; margin-top: 20vh; font-size: 18px;">Seleziona una nota per la lettura</div>
        </div>
    </div>

    <script>
        let allFolders = [];
        let allNotes = [];
        let currentFolderId = null;
        let loggedUserId = localStorage.getItem('joplin_user_id');

        window.onload = function() {
            updateAuthUI();
            fetchPublishedData();
        };

        function updateAuthUI() {
            const authBtn = document.getElementById('auth-btn');
            const authStatus = document.getElementById('auth-status');
            if (loggedUserId) {
                authBtn.innerText = '🚪 Esci';
                authStatus.innerText = '🔒 Privato';
            } else {
                authBtn.innerText = '🔑 Accedi';
                authStatus.innerText = '🌍 Pubblico';
            }
        }

        function handleAuthClick() {
            if (loggedUserId) {
                localStorage.removeItem('joplin_user_id');
                loggedUserId = null;
                updateAuthUI();
                fetchPublishedData();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        }

        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        async function performLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if(!email || !password) return alert('Inserisci email e password');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(!res.ok) return alert('Errore: ' + data.error);

                localStorage.setItem('joplin_user_id', data.userId);
                loggedUserId = data.userId;
                closeLoginModal();
                updateAuthUI();
                fetchPublishedData();
            } catch(e) {
                alert('Errore di connessione');
            }
        }

        async function fetchPublishedData() {
            try {
                const url = loggedUserId ? `/api/published-data?userId=${loggedUserId}` : '/api/published-data';
                const res = await fetch(url);
                const data = await res.json();

                allFolders = data.folders || [];
                allNotes = data.notes || [];

                renderFolders();
                
                // Se c'è almeno un taccuino e nessuno è selezionato, seleziona il primo
                if (allFolders.length > 0 && !currentFolderId) {
                    currentFolderId = allFolders[0].id;
                }
                
                if (currentFolderId) updateNoteList();
            } catch(e) {
                console.error("Errore recupero dati pubblicati", e);
            }
        }

        function renderFolders() {
            const container = document.getElementById('folders-container');
            container.innerHTML = '';

            if(allFolders.length === 0) {
                container.innerHTML = '<div style="padding:15px; color:#888; font-size:12px;">Nessun taccuino pubblicato.</div>';
                return;
            }

            allFolders.forEach(f => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                const icon = f.visibility === 'public' ? '🌍' : '🔒';
                const isActive = f.id === currentFolderId ? 'active' : '';
                div.innerHTML = `<div class="folder-title ${isActive}"><span>📁 ${f.title}</span><small style="font-size:10px;">${icon}</small></div>`;
                
                div.onclick = () => {
                    document.querySelectorAll('.folder-title').forEach(el => el.classList.remove('active'));
                    div.querySelector('.folder-title').classList.add('active');
                    currentFolderId = f.id;
                    updateNoteList();
                };
                container.appendChild(div);
            });
        }

        function updateNoteList() {
            const container = document.getElementById('notes-container');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = allNotes.filter(n => n.parent_id === currentFolderId);
            if(query) {
                filtered = filtered.filter(n => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query));
            }

            container.innerHTML = '';
            if(filtered.length === 0) {
                container.innerHTML = '<div style="padding:15px; color:#888; font-size:13px;">Nessuna nota trovata</div>';
                return;
            }

            filtered.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `<strong>${note.title}</strong>`;
                div.onclick = () => {
                    document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderContent(note);
                };
                container.appendChild(div);
            });
        }

        function renderContent(note) {
            const editorContent = document.getElementById('editor-content');
            let cleanBody = note.body.replace(/:\/([a-zA-Z0-9]{32})(?:\.[a-zA-Z0-9]+)?/g, '/api/resource/$1');
            let htmlContent = marked.parse(cleanBody);

            editorContent.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h1>${note.title}</h1>
                </div>
                <div>${htmlContent}</div>
            `;
        }
    </script>
</body>
</html>
