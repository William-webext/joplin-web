<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joplin Web Portal</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #22262b;
            --bg-notelist: #2a2e33;
            --bg-editor: #1e1e1e;
            --text-main: #d4d4d4;
            --text-muted: #8e9297;
            --accent-blue: #0e639c;
            --hover-bg: #353b42;
            --border-color: #3a3f45;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: var(--bg-editor); color: var(--text-main); overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        #sidebar { width: 240px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        #notes-list { width: 320px; background-color: var(--bg-notelist); display: flex; flex-direction: column; flex-shrink: 0; border-left: 1px solid var(--border-color); }
        #editor { flex-grow: 1; padding: 0; overflow-y: auto; background-color: var(--bg-editor); font-size: 15px; line-height: 1.6; min-width: 300px; display: flex; flex-direction: column; }
        
        .resizer { width: 4px; background-color: var(--border-color); cursor: col-resize; flex-shrink: 0; z-index: 10; }
        .resizer:hover, .resizer.active { background-color: var(--accent-blue); }

        .header { padding: 12px 15px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .list-container { overflow-y: auto; flex-grow: 1; }
        
        .folder-item { cursor: pointer; font-size: 13px; color: #ccc; }
        .folder-title { padding: 8px 15px; display: flex; align-items: center; }
        .folder-title:hover { background-color: var(--hover-bg); }
        .folder-title.active { background-color: var(--accent-blue); color: white; }
        .children-container { border-left: 1px solid #444; margin-left: 20px; }
        .toggle-arrow { display: inline-block; width: 12px; margin-right: 5px; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
        .toggle-arrow.open { transform: rotate(90deg); }

        .sidebar-actions { padding: 10px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 5px; background-color: var(--bg-sidebar); }
        .action-btn { width: 100%; padding: 8px; background: var(--bg-notelist); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 12px; text-align: center; }
        .action-btn:hover { background: var(--hover-bg); }

        .note-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .note-item:hover { background-color: var(--hover-bg); }
        .note-item.active { background-color: var(--accent-blue); color: white; }
        
        .search-bar { margin: 10px; padding: 6px 10px; background-color: #1a1c1f; border: 1px solid var(--border-color); border-radius: 4px; color: white; font-size: 13px; }
        .sort-dropdown { margin: 0 10px 10px 10px; padding: 5px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: var(--bg-sidebar); padding: 25px; border-radius: 8px; width: 450px; border: 1px solid var(--border-color); max-height: 80vh; overflow-y: auto; }
        input.login-input { padding: 10px; margin: 8px 0; font-size: 14px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-notelist); color: white; width: 100%; box-sizing: border-box; }

        #editor-content { padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        #editor h1 { font-size: 1.8em; margin-bottom: 0.5em; color: white; }
        #editor h2, #editor h3 { color: #569cd6; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 30px; }
        #editor a { color: #569cd6; text-decoration: none; }
    </style>
</head>
<body>

    <!-- MODALE LOGIN -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-card" style="width: 320px;">
            <form onsubmit="event.preventDefault(); performLogin();">
                <h3 style="margin-top:0; color:white;">Accedi al Portale</h3>
                <input type="email" id="emailInput" class="login-input" placeholder="Email" required>
                <input type="password" id="passwordInput" class="login-input" placeholder="Password" required>
                <button type="submit" class="action-btn" style="background: var(--accent-blue); color: white; margin-top: 10px;">Accedi</button>
                <button type="button" class="action-btn" style="margin-top:5px;" onclick="closeLoginModal()">Annulla</button>
            </form>
        </div>
    </div>

    <!-- MODALE GESTIONE GRUPPI (ADMIN) -->
    <div id="groups-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin-top:0; color:white;">⚙️ Gestione Gruppi Utenti</h3>
            <div id="groups-container-list"></div>
            <hr style="border-color: var(--border-color); margin: 15px 0;">
            <h4 style="color:white; margin-bottom: 5px;">Crea Nuovo Gruppo</h4>
            <input type="text" id="newGroupName" class="login-input" placeholder="Nome Gruppo (es. Reparto Tecnico)">
            <button class="action-btn" style="background: var(--accent-blue); color: white; margin-top: 5px;" onclick="createNewGroup()">+ Crea Gruppo</button>
            <button class="action-btn" style="margin-top: 15px;" onclick="closeGroupsModal()">Chiudi e Salva</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="header">
            <span>📓 Taccuini</span>
            <span id="auth-status" style="font-size:10px; color:#569cd6;"></span>
        </div>
        <div id="folders-container" class="list-container"></div>
        <div class="sidebar-actions">
            <button class="action-btn" onclick="fetchDataFromServer()">🔄 Aggiorna</button>
            <button id="admin-btn" class="action-btn" style="display:none; background:#2d3238;" onclick="openGroupsModal()">⚙️ Gruppi</button>
            <button id="auth-btn" class="action-btn" onclick="handleAuthClick()">🔑 Accedi</button>
        </div>
    </div>
    
    <div class="resizer" id="resizer-1"></div>

    <div id="notes-list">
        <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); padding-top: 10px;">
            <input type="text" id="searchInput" class="search-bar" style="margin-top: 0;" placeholder="Cerca titolo o testo..." onkeyup="updateNoteList()">
        </div>
        <div id="notes-container" class="list-container">
            <div style="padding:15px; color:#888; font-size: 13px;">Seleziona un taccuino...</div>
        </div>
    </div>

    <div class="resizer" id="resizer-2"></div>

    <div id="editor">
        <div id="editor-content">
            <div style="color: #888; text-align: center; margin-top: 20vh; font-size: 18px;">Seleziona una nota per la lettura</div>
        </div>
    </div>

    <script>
        let allFolders = [];
        let allNotes = [];
        let systemUsers = [];
        let systemGroups = [];
        let currentFolderId = null;
        let loggedUserId = localStorage.getItem('joplin_user_id');
        let isAdmin = localStorage.getItem('joplin_is_admin') === 'true';

        window.onload = function() {
            updateAuthUI();
            fetchDataFromServer();
        };

        function updateAuthUI() {
            const authBtn = document.getElementById('auth-btn');
            const adminBtn = document.getElementById('admin-btn');
            const authStatus = document.getElementById('auth-status');

            if (loggedUserId) {
                authBtn.innerText = '🚪 Esci';
                authStatus.innerText = '🔓 Autenticato';
                adminBtn.style.display = isAdmin ? 'block' : 'none';
            } else {
                authBtn.innerText = '🔑 Accedi';
                authStatus.innerText = '🌍 Pubblico';
                adminBtn.style.display = 'none';
            }
        }

        function handleAuthClick() {
            if (loggedUserId) {
                localStorage.removeItem('joplin_user_id');
                localStorage.removeItem('joplin_is_admin');
                loggedUserId = null;
                isAdmin = false;
                updateAuthUI();
                fetchDataFromServer();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        }

        function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

        async function performLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(!res.ok) return alert('Errore: ' + data.error);

                localStorage.setItem('joplin_user_id', data.userId);
                localStorage.setItem('joplin_is_admin', data.isAdmin);
                loggedUserId = data.userId;
                isAdmin = data.isAdmin;
                closeLoginModal();
                updateAuthUI();
                fetchDataFromServer();
            } catch(e) { alert('Errore connessione'); }
        }

        async function fetchDataFromServer() {
            try {
                const url = loggedUserId ? `/api/data?userId=${loggedUserId}` : '/api/data';
                const res = await fetch(url);
                const data = await res.json();

                allFolders = data.folders || [];
                allNotes = data.notes || [];

                renderFolderTree();
                if (currentFolderId) updateNoteList();
            } catch(e) {}
        }

        // GESTIONE GRUPPI ADMIN
        async function openGroupsModal() {
            const res = await fetch('/api/users-and-groups');
            const data = await res.json();
            systemUsers = data.users || [];
            systemGroups = data.groups || [];
            renderGroupsList();
            document.getElementById('groups-modal').style.display = 'flex';
        }

        function closeGroupsModal() {
            saveGroupsToServer();
            document.getElementById('groups-modal').style.display = 'none';
        }

        async function saveGroupsToServer() {
            await fetch('/api/admin/groups', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ groups: systemGroups })
            });
        }

        function createNewGroup() {
            const nameInput = document.getElementById('newGroupName');
            const name = nameInput.value.trim();
            if (!name) return alert('Inserisci un nome per il gruppo');
            const newGroup = { id: 'grp_' + Date.now(), name: name, members: [] };
            systemGroups.push(newGroup);
            nameInput.value = '';
            renderGroupsList();
        }

        function deleteGroup(groupId) {
            systemGroups = systemGroups.filter(g => g.id !== groupId);
            renderGroupsList();
        }

        function toggleMember(groupId, email) {
            const group = systemGroups.find(g => g.id === groupId);
            if (!group) return;
            if (!group.members) group.members = [];
            if (group.members.includes(email)) {
                group.members = group.members.filter(m => m !== email);
            } else {
                group.members.push(email);
            }
        }

        function renderGroupsList() {
            const container = document.getElementById('groups-container-list');
            container.innerHTML = '';

            if (systemGroups.length === 0) {
                container.innerHTML = '<div style="color:#888; font-size:13px;">Nessun gruppo creato.</div>';
                return;
            }

            systemGroups.forEach(g => {
                const card = document.createElement('div');
                card.style.cssText = 'background: #2a2e33; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #3a3f45;';
                
                let usersHtml = '';
                systemUsers.forEach(u => {
                    const isChecked = g.members && g.members.includes(u.email) ? 'checked' : '';
                    usersHtml += `<label style="display:block; font-size:12px; margin:3px 0; color:#ccc;"><input type="checkbox" ${isChecked} onchange="toggleMember('${g.id}', '${u.email}')"> ${u.email}</label>`;
                });

                card.innerHTML = `
                    <div style="display:flex; justify-between; align-items:center; margin-bottom: 8px;">
                        <strong style="color:white; font-size: 14px;">👥 ${g.name}</strong>
                        <button style="background:#a93226; color:white; border:none; border-radius:3px; padding:2px 6px; cursor:pointer; font-size:11px;" onclick="deleteGroup('${g.id}')">Elimina</button>
                    </div>
                    <div style="max-height: 100px; overflow-y:auto; border-top:1px solid #3a3f45; padding-top:5px;">
                        ${usersHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFolderTree() {
            const container = document.getElementById('folders-container');
            container.innerHTML = '';
            const folderMap = {};
            allFolders.forEach(f => folderMap[f.id] = { ...f, children: [] });
            const rootFolders = [];

            allFolders.forEach(f => {
                if (f.parent_id && folderMap[f.parent_id]) folderMap[f.parent_id].children.push(folderMap[f.id]);
                else rootFolders.push(folderMap[f.id]);
            });

            function createFolderHTML(folder) {
                const wrapper = document.createElement('div');
                wrapper.className = 'folder-item';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'folder-title';
                const icon = folder.icon ? `<span style="margin-right: 8px;">${folder.icon}</span>` : `<span style="margin-right: 8px;">📁</span>`;
                titleDiv.innerHTML = `${icon}${folder.title}`;

                titleDiv.onclick = () => {
                    document.querySelectorAll('.folder-title').forEach(el => el.classList.remove('active'));
                    titleDiv.classList.add('active');
                    currentFolderId = folder.id;
                    updateNoteList();
                };

                wrapper.appendChild(titleDiv);
                return wrapper;
            }

            rootFolders.forEach(root => container.appendChild(createFolderHTML(root)));
        }

        function updateNoteList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('notes-container');
            let filtered = allNotes.filter(n => n.parent_id === currentFolderId);

            if(query) filtered = filtered.filter(n => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query));

            container.innerHTML = '';
            if(filtered.length === 0) {
                container.innerHTML = '<div style="padding:15px; color:#888;">Nessuna nota trovata</div>'; return;
            }

            filtered.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `<strong>${note.title}</strong>`;
                div.onclick = () => {
                    document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderContent(note);
                };
                container.appendChild(div);
            });
        }

        function renderContent(note) {
            const editorContent = document.getElementById('editor-content');
            let cleanBody = note.body.replace(/:\/([a-zA-Z0-9]{32})(?:\.[a-zA-Z0-9]+)?/g, '/api/resource/$1');
            let htmlContent = marked.parse(cleanBody);
            editorContent.innerHTML = `<h1>${note.title}</h1><div>${htmlContent}</div>`;
        }
    </script>
</body>
</html>
