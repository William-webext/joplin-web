name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compila e Pubblica Immagine Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # :latest da solo non permette rollback — se una build ha un problema (come quello appena
          # risolto) non c'è modo di tornare alla precedente senza ricompilare a mano. Il tag con lo
          # short SHA del commit resta disponibile su GHCR anche dopo che :latest è stato aggiornato:
          # in caso di problemi basta ripuntare Portainer a ghcr.io/.../joplin-web:<sha> invece di :latest.
          tags: |
            ghcr.io/william-webext/joplin-web:latest
            ghcr.io/william-webext/joplin-web:${{ github.sha }}
